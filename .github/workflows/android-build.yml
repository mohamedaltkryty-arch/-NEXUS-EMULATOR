name: Build and smoke-test NEXUS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-android-build-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Unit tests, Android build and emulator smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NEXUS
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          if [ -z "\${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "/usr/local/lib/android/sdk" >> "$GITHUB_PATH"
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="\${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.nexus.emulator.debug
            adb shell am start -W -n com.nexus.emulator.debug/com.nexus.emulator.MainActivity
            sleep 3
            adb shell dumpsys activity activities | grep -q "com.nexus.emulator.MainActivity"
            adb shell pm path com.nexus.emulator.debug

      - name: Calculate APK checksum
        run: sha256sum app/build/outputs/apk/debug/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-emulator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
