name: NEXUS verification and Android release

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build the installable APK after verification is complete'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nexus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JVM tests and source checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout NEXUS
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK
        shell: bash
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
      - name: Set up Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify source policy
        run: |
          test -f app/src/main/AndroidManifest.xml
          test -f app/build.gradle
          test -f settings.gradle
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -Eq 'READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
      - name: Run JVM tests and Android lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Publish lint diagnostics to job log
        if: always()
        shell: bash
        run: |
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then cat "$REPORT"; else echo "No lint text report generated."; fi

  build:
    name: Build and verify installable APK
    needs: verify
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_apk == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-apk]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout NEXUS
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK
        shell: bash
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature and checksum
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p artifacts
          cp "$APK" "artifacts/NEXUS-EMULATOR-v0.8.1.apk"
          sha256sum "artifacts/NEXUS-EMULATOR-v0.8.1.apk" | tee artifacts/SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-emulator-v0.8.1-apk
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  emulator-smoke:
    name: Install and launch on Android emulator
    needs: build
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_apk == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-apk]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: nexus-emulator-v0.8.1-apk
          path: artifacts
      - name: Install and launch NEXUS
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            timeout 120s adb install -r artifacts/NEXUS-EMULATOR-v0.8.1.apk
            timeout 30s adb shell am force-stop com.nexus.emulator.v081
            timeout 60s adb shell am start -W -n com.nexus.emulator.v081/com.nexus.emulator.MainActivity
            sleep 3
            timeout 30s adb shell dumpsys activity activities | grep -q "com.nexus.emulator.MainActivity"
            timeout 30s adb shell pm path com.nexus.emulator.v081
            mkdir -p artifacts
            timeout 30s adb exec-out screencap -p > artifacts/nexus-home.png
            test -s artifacts/nexus-home.png
      - name: Upload emulator UI evidence
        uses: actions/upload-artifact@v4
        with:
          name: nexus-emulator-v0.8.1-smoke-evidence
          path: artifacts/nexus-*
          if-no-files-found: error
          retention-days: 14
